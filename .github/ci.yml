name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12" # matches the Dockerfile
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
        run: python -m pip install -r requirements.text.txt

      - name: Run tests
        run: python -m pytest
